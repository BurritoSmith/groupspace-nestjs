# external-ip and static-auth-secret are passed as CLI flags from docker-compose.yml
# (sourced from .env) rather than hardcoded here, so this file has no secrets/host-specific
# values and is safe to commit.
listening-port=3478
fingerprint
use-auth-secret
realm=spaces-turn.local
stale-nonce=600
min-port=49152
max-port=49252
no-cli
no-tlsv1
no-tlsv1_1
