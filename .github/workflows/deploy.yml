name: Deploy (development)

# Manually triggered only — no push/pull_request trigger. Run it from this repo's Actions tab
# ("Run workflow") or via `gh workflow run deploy.yml`.
on:
  workflow_dispatch:

permissions:
  id-token: write # required to mint the OIDC token Workload Identity Federation exchanges for GCP credentials
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  # gcloud compute ssh/scp's legacy (non-OS-Login) key mechanism defaults the remote username to
  # whoever is running gcloud *locally* — on a GitHub-hosted runner that's "runner", which
  # auto-provisioned a brand-new, empty /home/runner account on the VM instead of reaching the
  # existing deploy directory under /home/burra (found and cleaned up after the first real run).
  # Pinning the username explicitly is what actually fixes it.
  VM_USER: burra
  VM_NAME: spaces-vm
  VM_ZONE: us-central1-a
  BACKEND_URL: https://35-238-110-160.sslip.io/

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm test

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # `git archive`, NOT `tar` of the working directory. The difference is not cosmetic: a plain
      # tar packages whatever happens to be sitting in the workspace, and by this point the auth
      # step above has written a gha-creds-*.json credential file into it. Those were being shipped
      # to the VM on every single deploy and — because extraction never deletes — accumulating
      # there: 26 of them had built up before this was found. They are Workload Identity
      # `external_account` configs rather than service-account keys, so they carry no long-lived
      # secret and stop working when their workflow run ends, but they had no business leaving the
      # runner at all.
      #
      # An archive of the commit also means the VM gets exactly what is in git and nothing else —
      # no stray local build output, no editor droppings, and no .env from a workspace that happens
      # to have one.
      - name: Package the commit
        run: git archive --format=tar.gz -o /tmp/backend.tar.gz HEAD

      - name: Copy to the VM
        run: gcloud compute scp /tmp/backend.tar.gz "$VM_USER@$VM_NAME:backend.tar.gz" --zone="$VM_ZONE"

      # The prune before extraction is what makes a DELETED file actually disappear. `tar -x` only
      # adds and overwrites, so anything git dropped survived on the VM indefinitely — which broke a
      # real deploy: a removed script stayed behind, `COPY . .` swept it into the image, and the
      # build failed compiling a file that no longer existed in the repo.
      #
      # Everything at the top level goes EXCEPT deploy/, which is the one directory holding state
      # that was never in git and must not be destroyed: .env (real secrets), recordings/ (real
      # recording files), Caddyfile and turnserver.conf. Its tracked files are overwritten by the
      # extraction as usual.
      #
      # Residual, stated so it isn't a surprise later: a tracked file deleted from inside deploy/
      # itself would still linger. Nothing there has ever been removed, and widening the prune to
      # cover it risks the four files above for no benefit.
      - name: Extract and rebuild the docker compose stack
        run: |
          gcloud compute ssh "$VM_USER@$VM_NAME" --zone="$VM_ZONE" --command="
            mkdir -p ~/spaces-backend &&
            find ~/spaces-backend -mindepth 1 -maxdepth 1 ! -name deploy -exec rm -rf {} + &&
            tar -xzf backend.tar.gz -C ~/spaces-backend &&
            rm -f backend.tar.gz &&
            cd ~/spaces-backend/deploy &&
            docker compose up -d --build
          "

      - name: Show container status
        run: |
          gcloud compute ssh "$VM_USER@$VM_NAME" --zone="$VM_ZONE" --command="
            cd ~/spaces-backend/deploy &&
            docker compose logs app --tail=50 &&
            docker compose ps
          "

      - name: Health check
        run: |
          # The app container reports "Up" the instant it starts, well before Nest finishes
          # bootstrapping (Prisma connect, mediasoup worker init, etc.) — retry instead of
          # checking once immediately.
          for attempt in $(seq 1 10); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL")
            echo "Attempt $attempt: HTTP status $status"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "Health check failed"
          exit 1
